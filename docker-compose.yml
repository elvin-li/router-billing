# One-shot dev environment. Not for production (use the .ipk on OpenWrt).
#
#   docker compose up --build       # build + start with dry-firewall
#   docker compose exec rb sh       # poke around
#   curl localhost:8080/portal      # try the captive portal
#
# State persists in the named `state` volume; remove it to wipe.

services:
  rb:
    build: .
    container_name: router-billing
    ports:
      - "8080:8080"
    volumes:
      - state:/var/lib/router-billing
      - ./config.example.yaml:/etc/router-billing/config.yaml:ro
    environment:
      TZ: "Asia/Shanghai"
    # nftables would need NET_ADMIN; for the dev image we just run dry.
    command: ["-config", "/etc/router-billing/config.yaml", "--dry-firewall"]
    # Dry-firewall dev mode needs no capabilities at all — drop everything
    # and forbid privilege re-escalation (the image already runs as `rb`,
    # not root, but a compromised binary shouldn't be able to setuid back).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app only writes under /var/lib/router-billing (the named volume):
    # DB + WAL/journal live there and templates are read from the image.
    # Freeze everything else so a compromised process can't drop files
    # into the container. /tmp stays writable via tmpfs for SQLite's
    # temporary files.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  state:
