<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>备用码 · router-billing</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .codes-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px 14px; margin: 14px 0;
    }
    .codes-grid code {
      display: block; padding: 10px 12px;
      background: rgba(0,0,0,0.04); border: 1px solid var(--border);
      border-radius: 6px; font-size: 15px; letter-spacing: 1px;
      text-align: center; user-select: all;
    }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body class="portal">
  <header class="portal-hero" style="max-width:680px;">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div style="flex:1;">
      <h1>备用码</h1>
      <p class="sub">{{.User.Phone}} · 每个码只能使用一次</p>
    </div>
    <a href="/user/2fa" class="btn outline small no-print" style="width:auto;">完成</a>
  </header>

  <main class="portal-main" style="max-width:680px;">
    <div class="flash" style="background:#fff4d8; color:#7c5500; border-color:#f1c460;">
      <strong>⚠ 这是唯一一次看到这些备用码的机会。</strong>
      请立即截图、打印或抄写保存。关闭页面后将无法再次查看。
    </div>

    <section class="card">
      <h2 style="margin-top:0;">10 个一次性备用码</h2>
      <p style="color:var(--text-soft); font-size:13px;">
        当你丢失认证 App 时，在登录的「验证码」框里输入其中任意一个备用码（区分大小写不敏感、可以带空格 / 短横）即可登录。
        用过的码会立即失效。
      </p>
      <div class="codes-grid">
        {{range .Codes}}<code>{{.}}</code>{{end}}
      </div>
      <div class="no-print" style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn outline small" type="button" onclick="copyCodes()" style="width:auto;">复制所有</button>
        <button class="btn outline small" type="button" onclick="window.print()" style="width:auto;">打印</button>
        <a class="btn primary" href="/user/2fa" style="width:auto;">我已保存好</a>
      </div>
    </section>

    <p class="portal-footer no-print">router-billing v{{.Version}}</p>
  </main>

  <script>
    function copyCodes() {
      const codes = Array.from(document.querySelectorAll('.codes-grid code')).map(el => el.textContent).join('\n');
      navigator.clipboard.writeText(codes).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        // Fallback for non-https / unsupported browsers
        const ta = document.createElement('textarea');
        ta.value = codes; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
        alert('已复制到剪贴板');
      });
    }
  </script>
</body>
</html>
