<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>两步验证 · router-billing</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">
<div class="login-shell">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>两步验证</h1>
    <p class="sub">{{.Username}} · 打开 Authenticator 取 6 位码</p>

    {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}

    <form method="post" action="/admin/login/2fa">
      {{template "csrf" .}}
      <div class="field">
        <label>6 位验证码</label>
        <input name="code" type="text" inputmode="numeric" pattern="[0-9 -]*"
               maxlength="9" required autocomplete="one-time-code" autofocus
               placeholder="123 456"
               style="text-align:center; letter-spacing:0.25em; font-size:20px; font-family:ui-monospace,monospace;">
      </div>
      <button class="btn primary" type="submit" style="margin-top:8px;">验证</button>
    </form>
    <p class="hint" style="margin-top:16px; text-align:center; color: var(--text-soft);">
      丢了验证器？SSH 到路由器删 <code>config.yaml</code> 里这个 admin 的
      <code>totp_secret</code> 行后重启。
    </p>
  </div>
</div>
</body>
</html>
