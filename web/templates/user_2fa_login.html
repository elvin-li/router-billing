<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>二步验证 · router-billing</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="portal">
  <div class="login-shell" style="background: var(--bg-tinted); min-height: auto; padding: 32px 16px 60px;">
    <div class="login-card">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>二步验证</h1>
      <p class="sub">输入认证 App 显示的 6 位验证码（<span class="mono">{{.Phone}}</span>）</p>

      {{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}

      <form method="post" action="/user/login/2fa?next={{.Next}}">
        {{template "csrf" .}}
        <div class="field">
          <label>验证码</label>
          <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 autocomplete="one-time-code" autofocus required placeholder="6 位数字">
        </div>
        <button class="btn primary" type="submit" style="margin-top:8px;">登录</button>
      </form>

      <p class="hint" style="margin-top:16px; text-align:center;">
        丢失认证设备？<a href="/user/login">返回登录</a>，请联系管理员协助。
      </p>
    </div>
  </div>
</body>
</html>
