<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>注册 · router-billing</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="portal">
  <div class="login-shell" style="background: var(--bg-tinted); min-height: auto; padding: 32px 16px 60px;">
    <div class="login-card">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <h1>注册</h1>
      <p class="sub">手机号即账号，无需短信验证</p>

      {{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}

      <form method="post" action="/user/register">
        <div class="field">
          <label>手机号</label>
          <input name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位" required autofocus>
        </div>
        <div class="field">
          <label>密码（≥ 6 位）</label>
          <input name="password" type="password" minlength="6" maxlength="72" required>
        </div>
        <button class="btn primary" type="submit" style="margin-top:8px;">创建账号</button>
      </form>
      <p class="hint" style="margin-top:16px; text-align:center;">
        已有账号？<a href="/user/login">直接登录</a><br>
        <a href="/portal" style="color: var(--text-soft);">← 返回付费页</a>
      </p>
    </div>
  </div>
</body>
</html>
