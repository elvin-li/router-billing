<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>充值卡打印 {{.Batch}} · router-billing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #0f172a;
    }
    .toolbar {
      position: sticky; top: 0;
      background: #1e293b;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      z-index: 10;
    }
    .toolbar h1 { margin: 0; font-size: 16px; flex: 1; font-weight: 600; }
    .toolbar .count { color: #94a3b8; font-size: 13px; }
    .toolbar a, .toolbar button {
      padding: 8px 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }
    .toolbar a.outline {
      background: transparent;
      border: 1px solid #475569;
    }

    .sheet {
      max-width: 820px;
      margin: 24px auto;
      padding: 18px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(15,23,42,0.08);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .card {
      border: 1.5px dashed #94a3b8;
      border-radius: 8px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr 96px;
      gap: 14px;
      align-items: center;
      page-break-inside: avoid;
      break-inside: avoid;
      background: #fff;
    }
    .card .left { min-width: 0; }
    .card .brand {
      font-size: 11px;
      color: #6366f1;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .card .code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #0f172a;
      margin: 0 0 4px;
    }
    .card .meta {
      font-size: 12px;
      color: #64748b;
    }
    .card .price {
      font-size: 13px;
      color: #4f46e5;
      font-weight: 600;
      margin-top: 4px;
    }
    .card .qr {
      width: 96px;
      height: 96px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px;
      background: #fff;
    }
    .card .qr img { width: 100%; height: 100%; display: block; }
    .empty {
      padding: 64px 20px;
      text-align: center;
      color: #94a3b8;
    }
    .footer-tip {
      grid-column: 1 / -1;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      padding: 6px 0;
      border-top: 1px solid #e2e8f0;
      margin-top: 6px;
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet {
        max-width: none;
        margin: 0;
        padding: 12mm;
        box-shadow: none;
      }
      .card { break-inside: avoid; page-break-inside: avoid; }
    }
    @page { size: A4; margin: 8mm; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>充值卡打印</h1>
    <span class="count">{{if .Batch}}batch={{.Batch}} · {{end}}{{.Count}} 张可用</span>
    <a href="/admin/vouchers{{if .Batch}}?batch={{.Batch}}{{end}}" class="outline">返回</a>
    <button onclick="window.print()">打印</button>
  </div>

  <div class="sheet">
    {{if .Vouchers}}
    <div class="grid">
      {{range .Vouchers}}
      <div class="card">
        <div class="left">
          <div class="brand">WiFi 充值卡</div>
          <div class="code">{{.Pretty}}</div>
          <div class="meta">兑换：扫码或访问 router 内网 → /redeem</div>
          <div class="price">{{.Days}} 天</div>
        </div>
        <div class="qr"><img src="{{.QRPath}}" alt="QR"></div>
      </div>
      {{end}}
    </div>
    {{else}}
      <p class="empty">本批没有可用的充值码（可能都已被兑换或作废）</p>
    {{end}}
  </div>
</body>
</html>
