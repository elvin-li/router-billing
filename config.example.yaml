# router-billing 配置文件
# 复制到 /etc/router-billing/config.yaml 并按需修改

listen: ":8080"
db_path: /var/lib/router-billing/billing.db
web_root: /usr/share/router-billing/web

# 收费侧的桥接口（由 uci-defaults 生成，开放和加密的两个收费 SSID 共用）
paid_iface: br-paid

# 强制门户域名/IP — 客户端访问任意 HTTP 都会被劫持到这里
portal_host: 192.168.5.1
portal_port: 8080

# 管理员后台凭据。首次启动后请尽快修改。
# 可只用 admin: 单个，或用 admins: 列表多账号
admin:
  username: admin
  password: changeme

# 多管理员可选；每个支持 password 或 password_hash（bcrypt）
# 生成哈希：./router-billing --gen-password-hash
# admins:
#   - username: alice
#     password_hash: "$2a$10$..."
#   - username: bob
#     password: plain-or-hashed-doesnt-matter

# Prometheus /metrics 鉴权 token（留空 = 端点公开）
# metrics_token: "long-random-string"

# SSID 信息，仅给 /admin/ssid-cards 打印海报用，不影响实际网络。
#
# Free_WiFi 模型（v0.9+）：现在是「熟人 + 管理 WiFi」，必须有 WPA2 密码。
# - 你和你信任的家人/朋友连这个（不计费、不走门户）
# - 管理员也用这个进 /admin（不会被强制门户拦截）
# - 客户应该连 Paid_WiFi（开放，扫码付费） 或 Paid_Secure_WiFi（加密，VIP 付费）
#
# ssids:
#   free: Free_WiFi
#   free_key: change-this-or-i-will-auto-generate    # 强制要求 ≥8 字符；install.sh 没设的话自动生成
#   paid: Paid_WiFi
#   paid_secure: Paid_Secure_WiFi
#   paid_secure_key: super-secret-2024               # VIP 加密 SSID 的 PSK

# 计费套餐。price_cents 是人民币分。
plans:
  month:
    label: "1 个月"
    days: 30
    price_cents: 100      # ¥1
  year:
    label: "1 年"
    days: 365
    price_cents: 1000     # ¥10

# 微信支付（Native 扫码）
# 需要：商户号、AppID、APIv3 密钥、证书序列号、商户私钥
# 没有 HTTPS 公网域名也能用：不要配 notify_url（或留默认），系统会自动 fallback
# 到主动查单（出站 HTTPS，不要求公网入站）。详见 README。
pay:
  wechat:
    enabled: false
    mch_id: ""
    app_id: ""
    api_v3_key: ""
    serial_no: ""
    private_key_path: /etc/router-billing/wx_apiclient_key.pem
    # 有公网 HTTPS 时填，没有就保留默认占位
    notify_url: "https://your.domain/notify/wx"

  alipay:
    enabled: false
    app_id: ""
    private_key_path: /etc/router-billing/alipay_app_key.pem
    alipay_public_key_path: /etc/router-billing/alipay_public_key.pem
    notify_url: "https://your.domain/notify/ali"
    gateway: "https://openapi.alipay.com/gateway.do"

# 防火墙后端
firewall:
  backend: nftables
  table: inet
  table_name: billing
  set_name: mac_paid

# 后台任务
scheduler:
  expire_check_interval: 1h

# 自动备份（强烈建议在生产开启）
# backup:
#   enabled: true
#   dir: /var/lib/router-billing/backups
#   retain_days: 7
#   interval: 24h

# 内置 Shadowsocks AEAD 加密代理（可选，默认关闭）
#
# 让这台 OpenWrt 同时充当本地加密代理：给需要出站 SOCKS 式代理的设备一个
# ss:// 链接 / 二维码即可配置。它与 MAC 计费 / 强制门户完全独立，不会给未付费
# 设备放行上网 —— 前提是你把它绑定在 LAN 接口上（见下方安全提示）。
#
# 生成强密码：  ./router-billing --gen-ss-password
# 打印分享链接：./router-billing --ss-uri
# 支持的加密方式：chacha20-ietf-poly1305（默认）、aes-256-gcm、aes-128-gcm
#
# 安全提示：
#   * listen 只绑定 LAN 网关地址（例如 br-lan 的 192.168.5.1），
#     千万不要绑定付费 SSID 接口，否则未付费用户可绕过门户免费上网。
#   * 暴露到公网 (WAN) 有风险；如确需远程使用，请配合强密码 +
#     allowed_cidrs，并在防火墙限制来源。
#   * 仅支持 TCP（SOCKS5 CONNECT）。不做 UDP associate。
#
# shadowsocks:
#   enabled: true
#   listen: "192.168.5.1:8388"        # 仅监听 LAN！
#   method: "chacha20-ietf-poly1305"
#   password: "<--gen-ss-password 生成的强密码>"
#   # 可选项：
#   # advertise_host: "192.168.5.1"   # ss:// 里对客户端展示的地址（默认取 portal_host）
#   # tag: "my-router"                # 客户端里显示的名称
#   # allowed_cidrs: ["192.168.0.0/16"]   # 仅允许这些来源 IP 连接
#   # max_conns: 512                  # 并发连接上限
#   # timeout: 5m                     # 单向空闲超时
#   # replay_window: 60s              # salt 重放拒绝窗口（负值=关闭，不建议）
#   # open_firewall: true             # 由本进程用 nftables 放行端口
#   # firewall_iface: "br-lan"        # open_firewall 时限定的接口

# 出站 webhook（任何 payment/redeem/grant/revoke 都会 POST 到这个 URL）
# 接收端可用 secret 做 HMAC-SHA256 验签：header X-Router-Billing-Signature: sha256=<hex>
# webhook:
#   url: "https://shopkeeper.example/router-billing/hook"
#   secret: "a-long-random-shared-secret"
