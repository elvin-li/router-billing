# router-billing 配置文件
# 复制到 /etc/router-billing/config.yaml 并按需修改

listen: ":8080"
db_path: /var/lib/router-billing/billing.db
web_root: /usr/share/router-billing/web

# 收费侧的桥接口（由 uci-defaults 生成，开放和加密的两个收费 SSID 共用）
paid_iface: br-paid

# 强制门户域名/IP — 客户端访问任意 HTTP 都会被劫持到这里
portal_host: 192.168.5.1
portal_port: 8080

# 管理员后台凭据。首次启动后请尽快修改。
# 可只用 admin: 单个，或用 admins: 列表多账号
# 校验规则（--check-config 会检查）：
#   - 明文 password 至少 8 个字符（推荐用 password_hash 代替）
#   - password_hash 必须是合法 bcrypt（--gen-password-hash 生成）
#   - totp_secret 必须是合法 base32（--gen-totp-secret 生成）
#   - password 和 password_hash 二选一，用户名不能重复
admin:
  username: admin
  password: changeme

# 多管理员可选；每个支持 password 或 password_hash（bcrypt）
# 生成哈希：./router-billing --gen-password-hash
# admins:
#   - username: alice
#     password_hash: "$2a$10$..."
#   - username: bob
#     password: use-hash-in-production

# /api/admin/* 的 Bearer token（可选）。token 至少 16 个字符且不能重复。
# api_tokens:
#   - token: "long-random-string-at-least-16-chars"
#     label: monitoring
#     readonly: true          # 只允许 GET
#     rate_limit_per_min: 60  # 0 = 不限流

# Prometheus /metrics 鉴权 token（留空 = 端点公开；设置时至少 8 个字符）
# metrics_token: "long-random-string"

# SSID 信息，仅给 /admin/ssid-cards 打印海报用，不影响实际网络。
#
# Free_WiFi 模型（v0.9+）：现在是「熟人 + 管理 WiFi」，必须有 WPA2 密码。
# - 你和你信任的家人/朋友连这个（不计费、不走门户）
# - 管理员也用这个进 /admin（不会被强制门户拦截）
# - 客户应该连 Paid_WiFi（开放，扫码付费） 或 Paid_Secure_WiFi（加密，VIP 付费）
#
# ssids:
#   free: Free_WiFi
#   free_key: change-this-or-i-will-auto-generate    # 强制要求 ≥8 字符；install.sh 没设的话自动生成
#   paid: Paid_WiFi
#   paid_secure: Paid_Secure_WiFi
#   paid_secure_key: super-secret-2024               # VIP 加密 SSID 的 PSK

# 计费套餐。price_cents 是人民币分。
plans:
  month:
    label: "1 个月"
    days: 30
    price_cents: 100      # ¥1
  year:
    label: "1 年"
    days: 365
    price_cents: 1000     # ¥10

# 微信支付（Native 扫码）
# 需要：商户号、AppID、APIv3 密钥、证书序列号、商户私钥
# 没有 HTTPS 公网域名也能用：不要配 notify_url（或留默认），系统会自动 fallback
# 到主动查单（出站 HTTPS，不要求公网入站）。详见 README。
pay:
  wechat:
    enabled: false
    mch_id: ""
    app_id: ""
    api_v3_key: ""
    serial_no: ""
    private_key_path: /etc/router-billing/wx_apiclient_key.pem
    # 有公网 HTTPS 时填，没有就保留默认占位
    notify_url: "https://your.domain/notify/wx"

  alipay:
    enabled: false
    app_id: ""
    private_key_path: /etc/router-billing/alipay_app_key.pem
    alipay_public_key_path: /etc/router-billing/alipay_public_key.pem
    notify_url: "https://your.domain/notify/ali"
    gateway: "https://openapi.alipay.com/gateway.do"

# 防火墙后端
firewall:
  backend: nftables
  table: inet
  table_name: billing
  set_name: mac_paid

# 后台任务
scheduler:
  expire_check_interval: 1h

# 自动备份（强烈建议在生产开启）
# backup:
#   enabled: true
#   dir: /var/lib/router-billing/backups
#   retain_days: 7
#   interval: 24h

# 出站 webhook（任何 payment/redeem/grant/revoke 都会 POST 到这个 URL）
# 接收端用 secret 做 HMAC-SHA256 验签：header X-Router-Billing-Signature: sha256=<hex>
# 配置了 url 就必须配 secret（没有签名的 webhook 接收端无法验证真伪）。
# webhook:
#   url: "https://shopkeeper.example/router-billing/hook"
#   secret: "a-long-random-shared-secret"

# 安全加固（全部可选）
# security:
#   # 反向代理白名单（单 IP 或 CIDR）。只有请求直接来自这些地址时才信任
#   # X-Forwarded-For 取真实客户端 IP（用于限流和审计日志）。不配置（默认）
#   # 时该头一律忽略 —— 否则任何直连客户端都能伪造 IP 绕过按 IP 的限流。
#   # 用 nginx/Caddy 反代时请把代理地址列进来。
#   trusted_proxies:
#     - 127.0.0.1
#   # password_strength: strict      # 注册/改密/重置的密码策略（默认宽松）
#   # admin_session_hours: 12        # 管理员会话时长（1..168）
#   # user_session_days: 30          # 用户会话时长（1..365）
